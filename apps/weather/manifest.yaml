name: Weather
description: Observed conditions, high/low, and local time from NWS stations (Open-Meteo abroad)
# Seconds this app stays on screen per rotation.
dwell: 15
# Re-fetch this often (seconds). Well inside both services' free limits; station
# observations only update once or twice an hour anyway.
refresh_interval: 600
# Location by ZIP / postal code, geocoded to coordinates via api.zippopotam.us.
# Set `zipcode` to your area. For outside the US, set `country` to the ISO code
# (e.g. "gb", "ca", "de") and use the local postal code.
zipcode: "10001"
country: "us"
# Fallback coordinates, used only if `zipcode` is blank or can't be resolved.
latitude: 40.7128
longitude: -74.0060
# Header place name. Leave blank to auto-fill from the ZIP's town + state.
location_label: ""
# Show "Rain at HH:MM" when the next hour's chance of rain (within 24h) is at least
# this percent. Raise to make the alert less chatty; there's no alert below it.
rain_probability_threshold: 30
# Clock and rain-time format: "12h" (3:17 PM) or "24h" (15:17).
time_format: "12h"
# Seconds each of the weather icon's three animation states is held, so a full cycle
# is three times this. Lower is livelier — below ~0.2 the rain reads as flicker rather
# than as falling — but on a sign glanced at rather than watched, slower is calmer.
icon_frame_seconds: 0.8
# Where the numbers come from:
#   auto        NWS station observations in the US, Open-Meteo everywhere else
#   nws         force NWS (US only — shows the offline snapshot elsewhere)
#   open_meteo  force Open-Meteo, skipping observations entirely
# "auto" is what you want. See apps/weather/sources.py for why NWS goes first.
provider: "auto"
# How many of the nearest NWS stations to poll for a current observation. The app walks
# outward from the closest and takes the first one reporting usable conditions, because
# the flagship city stations are often the sparsest — KNYC in Central Park routinely
# reports no present weather at all.
observation_stations: 5
# Ignore observations older than this. Beyond ~90 min a station has usually just gone
# quiet, and stale conditions are worse than falling back to the forecast.
observation_max_age_minutes: 90
# Show the storm icon if any station within this many km reports thunderstorms, even
# when the nearest station is dry. Thunder and lightning carry well outside the rain,
# so the storm is worth showing while you can still see it from the window.
storm_radius_km: 25
# APIs (rarely need changing).
nws_base: "https://api.weather.gov"
api_base: "https://api.open-meteo.com/v1/forecast"
geocode_base: "https://api.zippopotam.us"
